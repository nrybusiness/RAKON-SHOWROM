<!--
  ============================================================
  RAKON TECHNOLOGY — SERVICES LOGIC
  Archivo: 03_SERVICES/ServicesLogic.html
  Responsabilidad: Motor de disponibilidad dinámica.
                   Calcula slots según duración del servicio
                   y bloquea solapamientos en tiempo real.
  ============================================================
-->
<script>
window.ServicesLogic = (function() {

  let currentBooking = {
    serviceId:      null,
    professionalId: null,
    dateOffset:     0,
    startMinute:    null
  };

  // ====================================================
  // SELECTORES DE ESTADO
  // ====================================================

  function reset() {
    currentBooking = {
      serviceId:      null,
      professionalId: null,
      dateOffset:     0,
      startMinute:    null
    };
  }

  function selectService(serviceId) {
    currentBooking.serviceId   = serviceId;
    currentBooking.startMinute = null;
  }

  function selectProfessional(professionalId) {
    currentBooking.professionalId = professionalId;
    currentBooking.startMinute    = null;
  }

  function selectDate(dateOffset) {
    currentBooking.dateOffset  = dateOffset;
    currentBooking.startMinute = null;
  }

  function selectSlot(startMinute) {
    currentBooking.startMinute = startMinute;
  }

  // ====================================================
  // MOTOR DE DISPONIBILIDAD DINÁMICA
  // ====================================================

  /**
   * Calcula los slots disponibles para el profesional + servicio + fecha actuales.
   * Lógica clave: usa la duración del servicio para descartar slots donde el
   * bloque completo no cabría (ej: si quedan 45min y el servicio dura 60min,
   * ese slot inicial NO se ofrece).
   */
  function getAvailableSlots() {
    if (!currentBooking.serviceId || !currentBooking.professionalId) return [];

    const service      = ServicesData.getServiceById(currentBooking.serviceId);
    const professional = ServicesData.getProfessionalById(currentBooking.professionalId);
    if (!service || !professional) return [];

    const duration = service.duration;
    const start    = professional.workingHours.start;
    const end      = professional.workingHours.end;
    const granularity = ServicesData.SLOT_GRANULARITY;

    // Citas ya reservadas para este profesional en esta fecha
    const booked = ServicesData.bookedAppointments.filter(b =>
      b.professionalId === currentBooking.professionalId &&
      b.dateOffset === currentBooking.dateOffset
    );

    const slots = [];
    for (let t = start; t + duration <= end; t += granularity) {
      const slotEnd = t + duration;

      // ¿Solapa con alguna cita existente?
      const overlaps = booked.some(b =>
        (t < b.endMinute && slotEnd > b.startMinute)
      );

      slots.push({
        startMinute: t,
        endMinute:   slotEnd,
        available:   !overlaps,
        label:       formatMinutes(t)
      });
    }

    return slots;
  }

  // ====================================================
  // HELPERS DE FORMATO
  // ====================================================

  function formatMinutes(mins) {
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    const period = h >= 12 ? 'PM' : 'AM';
    const h12 = h % 12 === 0 ? 12 : h % 12;
    return h12 + ':' + (m < 10 ? '0' + m : m) + ' ' + period;
  }

  function formatDateOffset(offset) {
    const days = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
    const months = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
    const d = new Date();
    d.setDate(d.getDate() + offset);
    return days[d.getDay()] + ' ' + d.getDate() + ' ' + months[d.getMonth()];
  }

  function getNextDays(count) {
    const result = [];
    for (let i = 0; i < count; i++) {
      result.push({
        offset: i,
        label:  formatDateOffset(i),
        isToday: i === 0
      });
    }
    return result;
  }

  // ====================================================
  // VALIDACIÓN Y CHECKOUT
  // ====================================================

  function isReadyToBook() {
    return !!(
      currentBooking.serviceId &&
      currentBooking.professionalId &&
      currentBooking.startMinute !== null
    );
  }

  function getBookingSummary() {
    if (!isReadyToBook()) return null;

    const service      = ServicesData.getServiceById(currentBooking.serviceId);
    const professional = ServicesData.getProfessionalById(currentBooking.professionalId);
    const endMinute    = currentBooking.startMinute + service.duration;

    return {
      service:        service.name,
      serviceIcon:    service.icon,
      professional:   professional.name,
      professionalRole: professional.role,
      date:           formatDateOffset(currentBooking.dateOffset),
      startTime:      formatMinutes(currentBooking.startMinute),
      endTime:        formatMinutes(endMinute),
      duration:       service.duration,
      price:          service.price
    };
  }

  function confirmBookingWhatsApp() {
    if (!isReadyToBook()) {
      Rakon.toast('error', 'Completa todos los pasos');
      return;
    }

    const s = getBookingSummary();
    const message =
      '💈 NUEVA CITA — ' + ServicesData.brand.name + '\n\n' +
      '👤 Servicio: ' + s.service + '\n' +
      '✂️ Profesional: ' + s.professional + ' (' + s.professionalRole + ')\n' +
      '📅 Fecha: ' + s.date + '\n' +
      '🕐 Hora: ' + s.startTime + ' - ' + s.endTime + '\n' +
      '⏱️ Duración: ' + s.duration + ' min\n' +
      '💰 Valor: ' + Rakon.formatCOP(s.price) + '\n\n' +
      'Confirmo mi reserva. ¿Necesito algún anticipo?';

    Rakon.alertConfirm(
      'Confirmar Cita',
      s.service + ' con ' + s.professional + ' · ' + s.date + ' a las ' + s.startTime,
      'Reservar por WhatsApp'
    ).then(result => {
      if (result.isConfirmed) {
        Rakon.sendToWhatsApp(message);
        reset();
        if (typeof ServicesView !== 'undefined' && ServicesView.refreshAll) {
          ServicesView.refreshAll();
        }
      }
    });
  }

  // ====================================================
  // API PÚBLICA
  // ====================================================

  return {
    get currentBooking()      { return currentBooking; },
    reset:                     reset,
    selectService:             selectService,
    selectProfessional:        selectProfessional,
    selectDate:                selectDate,
    selectSlot:                selectSlot,
    getAvailableSlots:         getAvailableSlots,
    getNextDays:               getNextDays,
    formatMinutes:             formatMinutes,
    formatDateOffset:          formatDateOffset,
    isReadyToBook:             isReadyToBook,
    getBookingSummary:         getBookingSummary,
    confirmBookingWhatsApp:    confirmBookingWhatsApp
  };
})();
</script>
